name: Monthly Minerba Company (MODI V2) Scraper
on:
  schedule:
    # 00:00 (midnight) on the 1st day of every month
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  scrape_and_commit_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Action to pull the latest code from the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        # Action to set up the Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        # The scraper requires: requests, pandas, tqdm, concurrent.futures (built-in), functools (built-in)
        # Assuming you have a requirements.txt, or we can install them directly
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas tqdm

      # IMPORTANT: Your script depends on a file named 'constants.py'.
      # This step assumes 'constants.py' exists in your repo and contains 'PROVINCE_ID_MAP'.

      - name: Execute scraper
        # Assuming your main script is named 'scraper.py' and is in the root directory
        # The script creates 'checkpoints' and 'datasets' directories
        run: |
          python -m scrapper.modi_v2

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"

      - name: Commit and Push new data
        # Check if there are changes to the 'datasets' folder or a new checkpoint was created
        # Your script names the final CSV with a timestamp, so we need to add the whole folder.
        run: |
          git add datasets/

          git diff-index --quiet HEAD \
            || git commit -m "chore: monthly update of Minerba company (modi v2) data" \
            || true

      - name: Push changes
        # Use the standard push action to push the committed changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
