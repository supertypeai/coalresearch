name: Monthly Mining License Data Upsert

on:
  schedule:
    # Run at 00:00 (midnight) on the 2nd day of every month (UTC time)
    - cron: "0 0 2 * *"
  workflow_dispatch:

jobs:
  process-minerba-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r minerba_commodities_scraper_requirements.txt

      - name: Merge mining license data
        run: |
          python -m scripts.modi_n_esdm_mining_license

      - name: Sort and upsert mining license data
        run: |
          python -m scrapper.sort_mining_license

      - name: Pull remote changes
        run: git pull origin main

      - name: Commit updated CSV and DB
        run: |
          # Configure Git user for the commit
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage files for commit
          git add db.sqlite 

          # Commit only if there are changes, using the specified commit message
          git diff-index --quiet HEAD \
            || git commit -m "chore: monthly update of db.sqlite for sorted mining_license" --allow-empty

      - name: Push changes
        # Using the specified action and settings
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
