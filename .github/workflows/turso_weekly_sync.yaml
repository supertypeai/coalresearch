name: Turso Weekly Sync

on:
  schedule:
    # Run every Tuesday at 00:00 UTC (Early morning)
    - cron: "0 0 * * 2"
  workflow_dispatch:

jobs:
  sync-turso-weekly:
    name: Sync Turso Weekly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Turso requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r turso/turso_requirements.txt

      - name: Execute Turso sync script (Weekly)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python turso/sync.py --mode weekly
