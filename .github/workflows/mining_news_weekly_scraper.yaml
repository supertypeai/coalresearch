name: Mining News Weekly Pipeline

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY1: ${{ secrets.GROQ_API_KEY1 }}
      GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
      GROQ_API_KEY_DEV: ${{ secrets.GROQ_API_KEY_DEV }}
      GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
      GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
      PROXY: ${{ secrets.PROXY }}
      
    steps: 
      - name: Checkout repository content
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Pull Latest Changes
        run: git pull --ff-only origin main
      
      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          uv sync

      - name: Set up Google Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          # installs the very latest Chrome snapshot (same as default)
          chrome-version: 'latest'
          # also installs the matching ChromeDriver binary
          install-chromedriver: true
          
      - name: Run Mining News and CoalMetal Scraping and Push Local
        run: uv run -m insider_news.pipeline scraper_weekly --limit-articles 5

      - name: Run Archive Old News
        run: uv run -m insider_news.pipeline archive --days-old 182

      - name: Commit and Update Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add db.sqlite insider_news/data/

          git diff-index --quiet HEAD \
            || git commit -m "chore: weekly scrape of mining news, update db.sqlite, and archive old data" --allow-empty

      - name: Push Changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main